name: DeadZone Lite Repo Migration

on:
  push:
    paths:
      - '.github/workflows/Repo_Migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LITE_ENGINE_REPOSITORY: ${{ secrets.LITE_ENGINE_REPOSITORY }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
    steps:
      - name: Validate migration access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$LITE_ENGINE_REPOSITORY" ]] || { echo 'Missing LITE_ENGINE_REPOSITORY' >&2; exit 1; }
          [[ -n "$PRIVATE_REPO_TOKEN" ]] || { echo 'Missing PRIVATE_REPO_TOKEN/GH_TOKEN' >&2; exit 1; }
          echo "::add-mask::$PRIVATE_REPO_TOKEN"

      - name: Checkout DeadZone Lite main
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.LITE_ENGINE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: toolbuild
          fetch-depth: 0
          lfs: true
          ref: main
          persist-credentials: true

      - name: Clone v21 tool source
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$PRIVATE_REPO_TOKEN"
          rm -rf "$RUNNER_TEMP/v21"
          git clone --depth 1 "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/hypermezo4-create/v21.git" "$RUNNER_TEMP/v21"

      - name: Migrate source tree and paths
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          replacements: list[tuple[str, str]] = []

          def run(*args: str) -> None:
              subprocess.run(args, check=True)

          def move(src_s: str, dst_s: str) -> None:
              src = root / src_s
              dst = root / dst_s
              if not src.exists() and not src.is_symlink():
                  return
              was_dir = src.is_dir() and not src.is_symlink()
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists() or dst.is_symlink():
                  raise RuntimeError(f"migration target already exists: {dst_s}")
              run("git", "mv", src_s, dst_s)
              replacements.append((src_s + ("/" if was_dir else ""), dst_s + ("/" if was_dir else "")))

          # Core helpers.
          move("functions.sh", "bin/core/functions.sh")
          move("functions.core.sh", "bin/core/functions.core.sh")

          # Tool families.
          move("bin/Linux", "bin/tool/Linux")
          move("bin/apktool", "bin/tool/apktool")
          move("bin/imgextractor", "bin/tool/imgextractor")

          # Device data, de-bloat and ROM downloader.
          move("bin/ddevice", "bin/device")
          move("bin/device/DEBLOAT", "bin/package/DEBLOAT")
          move("bin/device/getROM.sh", "bin/core/rom/download.sh")

          # Mod families. All payload files move with their module via git mv.
          move("bin/modfile", "bin/mods")
          move("bin/mods/UpdateFile", "bin/mods/Update")
          move("bin/mods/OS1/insmod.sh", "bin/mods/OS1/run.sh")
          move("bin/mods/OS2/insmod.sh", "bin/mods/OS2/run.sh")
          move("bin/mods/OS3/insmod.sh", "bin/mods/OS3/run.sh")
          move("bin/mods/Universal/insfile.sh", "bin/mods/Universal/run.sh")
          move("bin/mods/Update/insupdate.sh", "bin/mods/Update/run.sh")

          # Package families.
          move("bin/package/patchpackage.sh", "bin/package/run.sh")
          move("bin/package/KouseiPatcher", "bin/package/Kousei")
          move("bin/package/NOTIFICATION_FIX", "bin/package/NotificationFix")

          # Flash payload and standalone utilities.
          move("bin/script2flash", "bin/flash/script2flash")
          for name in ("supermeta.py", "lpunpack.py", "getSuperSize.sh"):
              move(f"bin/{name}", f"bin/tool/super/{name}")
          for name in ("fix_selinux.py", "strRep.py"):
              move(f"bin/{name}", f"bin/tool/utils/{name}")

          # Tracked runtime state, if any, belongs only in bin/runtime.
          info_names = (
              "androidver.txt", "sdkLevel.txt", "device_type.txt", "rom_os.txt",
              "device_code.txt", "base_rom_code.txt", "device_f.txt", "romtype.txt",
              "super_list.txt", "base_rom_device.txt", "base_rom_android.txt",
          )
          for name in info_names:
              move(f"bin/device/{name}", f"bin/runtime/info/{name}")
          move("bin/device/fstype.txt", "bin/runtime/filesystem/legacy.txt")
          move("bin/device/fstype", "bin/runtime/filesystem/partitions")

          # Everything else directly under bin is support/tooling. This guarantees
          # a clean top-level bin map without dropping any tracked file or binary.
          allowed = {"tool", "core", "device", "mods", "package", "flash", "runtime"}
          for item in sorted((root / "bin").iterdir(), key=lambda p: p.name):
              if item.name in allowed:
                  continue
              if item.name == "output":
                  move("bin/output", "bin/runtime/output")
              elif item.is_dir() and not item.is_symlink():
                  move(f"bin/{item.name}", f"bin/tool/{item.name}")
              else:
                  move(f"bin/{item.name}", f"bin/tool/utils/{item.name}")

          # Generated runtime files: rewrite even when they are not tracked today.
          replacements.extend([
              ("bin/device/androidver.txt", "bin/runtime/info/androidver.txt"),
              ("bin/device/sdkLevel.txt", "bin/runtime/info/sdkLevel.txt"),
              ("bin/device/device_type.txt", "bin/runtime/info/device_type.txt"),
              ("bin/device/rom_os.txt", "bin/runtime/info/rom_os.txt"),
              ("bin/device/device_code.txt", "bin/runtime/info/device_code.txt"),
              ("bin/device/base_rom_code.txt", "bin/runtime/info/base_rom_code.txt"),
              ("bin/device/device_f.txt", "bin/runtime/info/device_f.txt"),
              ("bin/device/romtype.txt", "bin/runtime/info/romtype.txt"),
              ("bin/device/super_list.txt", "bin/runtime/info/super_list.txt"),
              ("bin/device/fstype.txt", "bin/runtime/filesystem/legacy.txt"),
              ("bin/device/fstype/", "bin/runtime/filesystem/partitions/"),
              ("/apk_temp", "/bin/runtime/apk"),
              ("/jar_temp", "/bin/runtime/jar"),
          ])

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw in tracked:
              if not raw:
                  continue
              path = root / os.fsdecode(raw)
              if not path.is_file() or path.is_symlink():
                  continue
              data = path.read_bytes()
              if b"\0" in data:
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              for var in ("$work_dir", "${work_dir}", "$WORK_DIR", "${WORK_DIR}", "$WDIR", "${WDIR}", "$dir", "${dir}"):
                  text = text.replace(f"{var}/functions.sh", f"{var}/bin/core/functions.sh")
              text = text.replace('bin/$(uname)/$(uname -m)', 'bin/tool/$(uname)/$(uname -m)')
              if text != original:
                  path.write_text(text, encoding="utf-8")

          # One clean runtime tree is created for every build.
          build = root / "build.sh"
          text = build.read_text(encoding="utf-8")
          anchor = 'rm -rf "$work_dir/build"\n'
          runtime_init = (
              'rm -rf "$work_dir/bin/runtime"\n'
              'mkdir -p "$work_dir/bin/runtime/info" "$work_dir/bin/runtime/filesystem/partitions" \\\n'
              '    "$work_dir/bin/runtime/apk" "$work_dir/bin/runtime/jar" \\\n'
              '    "$work_dir/bin/runtime/logs" "$work_dir/bin/runtime/reports"\n'
          )
          if runtime_init not in text:
              if anchor not in text:
                  raise RuntimeError("build.sh runtime initialization anchor missing")
              text = text.replace(anchor, anchor + runtime_init, 1)
              build.write_text(text, encoding="utf-8")

          # Remove the inactive one-shot workflow that was created inside Lite.
          old_workflow = root / ".github/workflows/repo-inventory.yml"
          if old_workflow.exists():
              run("git", "rm", str(old_workflow.relative_to(root)))
          PY

          # Commit v21 primary APK/JAR tools if DeadZone did not already bundle them.
          mkdir -p bin/tool/apktool
          for tool in APKEditor.jar baksmali.jar smali.jar; do
            if [[ ! -s "bin/tool/apktool/$tool" ]]; then
              cp "$RUNNER_TEMP/v21/$tool" "bin/tool/apktool/$tool"
            fi
            unzip -tqq "bin/tool/apktool/$tool"
          done

          # Required compatibility fallbacks remain present.
          test -s bin/tool/apktool/apke.jar
          test -s bin/tool/apktool/baksmaliv2.jar
          test -s bin/tool/apktool/smaliv2.jar

          # The ROM tree itself is not part of this migration.
          if git diff --name-only | grep -q '^build/baserom/images/'; then
            echo '[ERROR] migration touched ROM image data' >&2
            exit 1
          fi

          # No old repository path may survive in source code.
          if git grep -nE 'bin/(ddevice|modfile|v21-tools|apktool|Linux|imgextractor|script2flash)(/|$)' -- ':!*.md'; then
            echo '[ERROR] legacy source path remains' >&2
            exit 1
          fi

          # Validate shell syntax after all moves/path rewrites.
          while IFS= read -r file; do
            bash -n "$file"
          done < <(git ls-files '*.sh' '*.SH')

          # Exact top-level bin contract.
          allowed='bin/core bin/device bin/flash bin/mods bin/package bin/runtime bin/tool'
          while IFS= read -r entry; do
            case " $allowed " in
              *" $entry "*) ;;
              *) echo "[ERROR] unexpected bin root entry: $entry" >&2; exit 1 ;;
            esac
          done < <(find bin -mindepth 1 -maxdepth 1 -print | sort)

          echo '=== NEW BIN TREE ==='
          find bin -mindepth 1 -maxdepth 2 -printf '%y %p\n' | sort
          echo '=== CHANGES ==='
          git status --short

      - name: Commit migration to DeadZone Lite main
        working-directory: toolbuild
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DeadZone Migration'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No migration changes'; exit 1; }
          git commit -m 'repo: migrate to structured bin layout'
          git push origin HEAD:main
