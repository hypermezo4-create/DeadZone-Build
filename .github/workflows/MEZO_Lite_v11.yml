name: "🔥 DeadZone Lite v1.1"

run-name: "DeadZone Lite • ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Bot request ID"
        required: true
        type: string
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    uses: ./.github/workflows/MEZO_Lite.yml
    with:
      request_id: ${{ inputs.request_id }}
    secrets: inherit

  release-contract:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout launcher contract tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download legacy Lite result
        uses: actions/download-artifact@v4
        with:
          name: deadzone-result-${{ inputs.request_id }}
          path: legacy-result

      - name: Upgrade Lite result to release contract v1.1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/upgrade_lite_result_v11.py \
            --input legacy-result/deadzone-result.json \
            --output deadzone-result.json \
            --request-id "${{ inputs.request_id }}"

      - name: Remove legacy artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: deadzone-result-${{ inputs.request_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]
          expected = os.environ["ARTIFACT_NAME"]
          url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          matches = [item for item in payload.get("artifacts", []) if item.get("name") == expected]
          if len(matches) != 1:
              raise SystemExit(f"Expected one legacy result artifact, found {len(matches)}")
          artifact_id = int(matches[0]["id"])
          delete = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}",
              method="DELETE",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(delete, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit(f"Legacy artifact delete returned {response.status}")
          PY

      - name: Expose release contract v1.1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-result-${{ inputs.request_id }}
          path: deadzone-result.json
          if-no-files-found: error
          retention-days: 1
