name: "🔥 DeadZone Lite"

run-name: "DeadZone Lite  ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Opaque DeadZone control request ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deadzone-lite-build-queue
  cancel-in-progress: false

jobs:
  build:
    name: "🔥 Build DeadZone Lite"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      CONTROL_BOT_CONTRACT_URL: https://deadzonebot.fly.dev/contract/resolve

    steps:
      - name: Validate public request ID
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$REQUEST_ID" =~ ^DZ-LT-[0-9]{8}-[0-9]{4}$ ]] || {
            echo "Invalid DeadZone Lite request ID" >&2
            exit 1
          }

      - name: Resolve private request contract
        shell: bash
        env:
          BUILD_PROGRESS_SECRET: ${{ secrets.BUILD_PROGRESS_SECRET }}
        run: |
          set -Eeuo pipefail
          [[ -n "${BUILD_PROGRESS_SECRET:-}" ]] || { echo "Missing BUILD_PROGRESS_SECRET" >&2; exit 1; }
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          secret = os.environ["BUILD_PROGRESS_SECRET"]
          request_id = os.environ["REQUEST_ID"]
          payload = {
              "schema_version": "1.0",
              "request_id": request_id,
              "project": "lite",
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }
          body = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["CONTROL_BOT_CONTRACT_URL"],
              data=body,
              method="POST",
              headers={"Content-Type": "application/json", "X-DeadZone-Signature": signature},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              response_body = response.read()
              response_signature = response.headers.get("X-DeadZone-Signature", "")
          expected = hmac.new(secret.encode(), response_body, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, response_signature):
              raise SystemExit("Invalid control-bot response signature")
          contract = json.loads(response_body)
          if contract.get("request_id") != request_id or contract.get("project") != "lite":
              raise SystemExit("Private contract mismatch")
          source_url = str(contract.get("source", {}).get("url") or "")
          builder = contract.get("builder") or {}
          builder_id = int(builder.get("telegram_user_id") or 0)
          builder_slug = str(builder.get("slug") or "")
          if not source_url.startswith("https://"):
              raise SystemExit("Lite source URL is missing or invalid")
          if builder_id <= 0 or not builder_slug:
              raise SystemExit("Builder identity is missing")
          print(f"::add-mask::{source_url}")
          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as out:
              out.write("ROM_URL_B64=" + base64.b64encode(source_url.encode()).decode() + "\n")
              out.write(f"BUILDER_ID={builder_id}\n")
              out.write(f"BUILDER_SLUG={builder_slug}\n")
          PY

      - name: Validate private engine configuration
        shell: bash
        env:
          LITE_ENGINE_REPOSITORY: ${{ secrets.LITE_ENGINE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
          RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
        run: |
          set -Eeuo pipefail
          for key in LITE_ENGINE_REPOSITORY PRIVATE_REPO_TOKEN RCLONE_CONFIG_BASE64 RCLONE_REMOTE_NAME RCLONE_UPLOAD_DIR; do
            [[ -n "${!key:-}" ]] || { echo "Missing required configuration: $key" >&2; exit 1; }
          done

      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: Clone private DeadZone Lite engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.LITE_ENGINE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: toolbuild
          fetch-depth: 1
          lfs: true
          ref: main
          persist-credentials: false

      - name: Set timezone
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: Set up Java 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Lite build dependencies
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 jq sshpass python-is-python3 wget python3-pip lz4 xz-utils \
            device-tree-compiler zlib1g-dev gcc g++ libc6 libstdc++6 dialog libgtk-3-dev \
            busybox zip unzip p7zip-full zstd bc android-sdk-libsparse-utils
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends erofs-utils || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xmlstarlet || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zipalign || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aapt || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rclone || curl -fsSL https://rclone.org/install.sh | sudo bash
          python3 -m pip install --user ConfigObj setuptools "gdown==5.2.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          chmod +x build.sh packROM.sh uploadROM.sh
          find bin -type f -name '*.sh' -exec chmod +x {} +
          chmod +x bin/Linux/x86_64/*
          bash -n build.sh
          bash -n packROM.sh
          bash -n uploadROM.sh

      - name: Support custom ROM filenames
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("bin/ddevice/getROM.sh")
          text = path.read_text(encoding="utf-8")
          old = '''else
              device_code="YourDevice"
              base_rom_code="Unknown"
              region_source="$device_code"
          fi'''
          new = '''else
              rom_stem="${rom_filename%.*}"
              device_code="${rom_stem%%-*}"
              base_rom_code=$(printf '%s\n' "$rom_stem" | grep -oE '(OS[123](\.[[:alnum:]]+)+|V1[34](\.[[:alnum:]]+)+)' | head -n 1 || true)
              region_source="$device_code"
              if [[ -z "$base_rom_code" ]]; then
                  base_rom_code="Unknown"
              fi
          fi'''
          if old not in text:
              raise SystemExit("Expected ROM metadata block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          bash -n bin/ddevice/getROM.sh

      - name: Build ROM
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          input_url="$(printf '%s' "$ROM_URL_B64" | base64 --decode)"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            bash build.sh "$input_url" 2>&1 | tee build_action.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-lite-diagnostics-${{ inputs.request_id }}
          path: |
            toolbuild/build_action.log
            toolbuild/build/baserom/super_merge_diagnostics.txt
            toolbuild/build/baserom/super_info.json
          if-no-files-found: warn
          retention-days: 3

      - name: Pack ROM
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            bash packROM.sh 2>&1 | tee pack_action.log

      - name: Upload pack diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-lite-pack-diagnostics-${{ inputs.request_id }}
          path: |
            toolbuild/pack_action.log
            toolbuild/build/pack_diagnostics
          if-no-files-found: warn
          retention-days: 3

      - name: Upload privately to Google Drive
        working-directory: toolbuild
        shell: bash
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
          RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
        run: |
          set -Eeuo pipefail
          base_dir="${RCLONE_UPLOAD_DIR%/}"
          export RCLONE_UPLOAD_DIR="${base_dir}/lite/${BUILDER_SLUG}_${BUILDER_ID}/${REQUEST_ID}"
          bash uploadROM.sh setup
          bash uploadROM.sh

      - name: Create verified DeadZone result contract
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          request_id = os.environ["REQUEST_ID"]
          file_name = Path("bin/ddevice/output_zip.txt").read_text(encoding="utf-8").strip()
          drive_link = Path("bin/ddevice/drive_link.txt").read_text(encoding="utf-8").strip()
          artifact = Path("out") / file_name
          if not artifact.is_file() or artifact.stat().st_size <= 0:
              raise SystemExit("Lite output archive is missing")
          parsed = urlsplit(drive_link)
          if parsed.scheme != "https" or parsed.hostname not in {"drive.google.com", "docs.google.com"}:
              raise SystemExit("Lite delivery link is invalid")
          result = {
              "schema_version": "1.0",
              "request_id": request_id,
              "project": "lite",
              "status": "success",
              "provider": "google_drive",
              "url": drive_link,
              "file_name": file_name,
              "sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "size": artifact.stat().st_size,
              "completed_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("../deadzone-result.json").write_text(json.dumps(result, sort_keys=True, indent=2), encoding="utf-8")
          PY

      - name: Expose only the verified result contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-result-${{ inputs.request_id }}
          path: deadzone-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary credentials
        if: always()
        working-directory: toolbuild
        shell: bash
        run: rm -f -- rclone.conf
