name: "🔥 MEZO_Lite"

on:
  workflow_dispatch:
    inputs:
      rom_link:
        description: "Direct ROM link for the DeadZone Lite build"
        required: true
      request_source:
        description: "Request source label"
        required: false
        default: "github"
      publish_release:
        description: "Publish release automatically?"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: mezo-lite-build-queue
  cancel-in-progress: false

jobs:
  Initialize:
    name: "🔥 Build MEZO Lite"
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
      MEZO_PRIVATE_CHAT_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
      TELEGRAM_RELEASE_GROUP_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID }}
      DEADZONE_EMOJI_PACK_NAME: ${{ secrets.DEADZONE_EMOJI_PACK_NAME }}
      DEADZONE_PREMIUM_EMOJI_SETS: ${{ secrets.DEADZONE_PREMIUM_EMOJI_SETS }}
      DEADZONE_CUSTOM_EMOJI_IDS_FILE: "config/deadzone-custom-emoji-ids.json"
      MEZO_CONTACT_LINK: ${{ secrets.MEZO_CONTACT_LINK }}
      UPDATES_GROUP_LINK: ${{ secrets.UPDATES_GROUP_LINK }}
      SCREENSHOTS_GROUP_LINK: ${{ secrets.SCREENSHOTS_GROUP_LINK }}
      CHAT_GROUP_LINK: ${{ secrets.CHAT_GROUP_LINK }}
      CHANGELOG_LINK: ${{ secrets.CHANGELOG_LINK }}
      SCREENSHOTS_POST_LINK: ${{ secrets.SCREENSHOTS_POST_LINK }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
      RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
      REQUEST_SOURCE: ${{ inputs.request_source }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
      DEADZONE_NOTIFY_CONNECT_TIMEOUT: "3.5"
      DEADZONE_NOTIFY_READ_TIMEOUT: "6"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          swap-size-mb: 1024
          root-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: Clone private MEZO Lite source
        uses: actions/checkout@v4
        with:
          repository: hypermezo4-create/DeadZone_Lite
          token: ${{ secrets.GH_TOKEN }}
          path: toolbuild
          fetch-depth: 1
          lfs: true
          ref: main

      - name: Install notification dependencies
        working-directory: toolbuild
        run: python3 -c "import requests" 2>/dev/null || python3 -m pip install --user requests

      - name: Send instant request notification
        continue-on-error: true
        working-directory: toolbuild
        env:
          DEADZONE_PREMIUM_EMOJI: "0"
        run: timeout 8s python3 notify.py "start" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Upgrade request notification to DeadZone Motion
        continue-on-error: true
        working-directory: toolbuild
        run: timeout 20s python3 notify.py "start" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Set timezone
        run: sudo timedatectl set-timezone Africa/Cairo

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        working-directory: toolbuild
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 jq sshpass python-is-python3 wget python3-pip lz4 xz-utils \
            device-tree-compiler zlib1g-dev gcc g++ libc6 libstdc++6 dialog libgtk-3-dev \
            busybox zip unzip p7zip-full zstd bc android-sdk-libsparse-utils
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends erofs-utils || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends xmlstarlet || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends zipalign || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends aapt || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends rclone || curl -fsSL https://rclone.org/install.sh | sudo bash
          python3 -m pip install --user ConfigObj setuptools "gdown==5.2.0"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Grant required file permissions
        working-directory: toolbuild
        run: |
          chmod +x build.sh packROM.sh uploadROM.sh
          find bin -type f -name '*.sh' -exec chmod +x {} +
          chmod +x bin/Linux/x86_64/*

      - name: Verify bundled payload extractor
        working-directory: toolbuild
        run: |
          test -x bin/Linux/x86_64/payload-extract
          bin/Linux/x86_64/payload-extract --help >/dev/null 2>&1 || true

      - name: Verify super image tools
        working-directory: toolbuild
        run: |
          set -euo pipefail
          test -x /usr/bin/simg2img
          test -f bin/supermeta.py
          python3 bin/supermeta.py --help >/dev/null
          bash -n build.sh
          bash -n packROM.sh

      - name: Support custom ROM filenames
        working-directory: toolbuild
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("bin/ddevice/getROM.sh")
          text = path.read_text(encoding="utf-8")
          old = '''else
              device_code="YourDevice"
              base_rom_code="Unknown"
              region_source="$device_code"
          fi'''
          new = '''else
              rom_stem="${rom_filename%.*}"
              device_code="${rom_stem%%-*}"
              base_rom_code=$(printf '%s\n' "$rom_stem" | grep -oE '(OS[123](\.[[:alnum:]]+)+|V1[34](\.[[:alnum:]]+)+)' | head -n 1 || true)
              region_source="$device_code"
              if [[ -z "$base_rom_code" ]]; then
                  base_rom_code="Unknown"
              fi
          fi'''
          if old not in text:
              raise SystemExit("Expected ROM metadata block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          bash -n bin/ddevice/getROM.sh

      - name: Build ROM
        working-directory: toolbuild
        env:
          INPUT_URL: ${{ inputs.rom_link }}
        run: |
          set -e
          set -o pipefail
          echo "CURRENT_STAGE=parse_rom_metadata" >> "$GITHUB_ENV"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash build.sh "$INPUT_URL" 2>&1 | tee build_action.log

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadzone-lite-build-diagnostics
          path: |
            toolbuild/build_action.log
            toolbuild/build/baserom/super_merge_diagnostics.txt
            toolbuild/build/baserom/super_info.json
          if-no-files-found: warn
          retention-days: 7

      - name: Send packaging notification
        continue-on-error: true
        working-directory: toolbuild
        run: timeout 8s python3 notify.py "pack" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Pack ROM
        working-directory: toolbuild
        run: |
          set -e
          set -o pipefail
          echo "CURRENT_STAGE=package" >> "$GITHUB_ENV"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash packROM.sh 2>&1 | tee pack_action.log

      - name: Upload pack diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deadzone-lite-pack-diagnostics
          path: |
            toolbuild/pack_action.log
            toolbuild/build/pack_diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Set up Rclone
        working-directory: toolbuild
        run: |
          set -e
          set -o pipefail
          echo "CURRENT_STAGE=setup_rclone" >> "$GITHUB_ENV"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash uploadROM.sh setup

      - name: Send upload notification
        continue-on-error: true
        working-directory: toolbuild
        run: timeout 8s python3 notify.py "upload" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Upload ROM to Google Drive
        working-directory: toolbuild
        run: |
          set -e
          set -o pipefail
          echo "CURRENT_STAGE=upload_drive" >> "$GITHUB_ENV"
          sudo -E env "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash uploadROM.sh

      - name: Send success notification
        if: success()
        continue-on-error: true
        working-directory: toolbuild
        run: timeout 8s python3 notify.py "success" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Publish release notification
        if: success() && (startsWith(inputs.request_source, 'telegram') || inputs.publish_release == 'true')
        continue-on-error: true
        working-directory: toolbuild
        env:
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID }}
        run: timeout 12s python3 notify.py "success" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Request manual publish decision
        if: success() && !startsWith(inputs.request_source, 'telegram') && inputs.publish_release != 'true'
        continue-on-error: true
        working-directory: toolbuild
        run: timeout 8s python3 notify.py "success" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Send failure notification
        if: failure()
        continue-on-error: true
        working-directory: toolbuild
        run: timeout 8s python3 notify.py "fail" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true

      - name: Send cancellation notification
        if: cancelled()
        continue-on-error: true
        working-directory: toolbuild
        run: timeout 8s python3 notify.py "cancelled" "DeadZone_Lite" "${{ inputs.rom_link }}" "mezo-lite" || true
