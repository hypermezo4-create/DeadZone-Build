name: Temporary Telegram Sound Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_sound_smoke_now.yml

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MEZO_PRIVATE_CHAT_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
      TELEGRAM_RELEASE_GROUP_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Send sound now
        shell: bash
        run: |
          set -Eeuo pipefail
          chat_id="${MEZO_PRIVATE_CHAT_ID:-${TELEGRAM_RELEASE_GROUP_ID:-}}"
          [[ -n "${TELEGRAM_BOT_TOKEN:-}" ]] || { echo 'Missing TELEGRAM_BOT_TOKEN' >&2; exit 1; }
          [[ -n "$chat_id" ]] || { echo 'Missing Telegram destination' >&2; exit 1; }

          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi

          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'sine=frequency=659:sample_rate=48000,volume=0.14' \
            -f lavfi -i 'sine=frequency=784:sample_rate=48000,volume=0.10' \
            -filter_complex '[0:a][1:a]amix=inputs=2:duration=shortest,afade=t=out:st=1.0:d=0.45' \
            -t 1.45 -c:a libmp3lame -b:a 128k /tmp/deadzone-sound-test.mp3

          response="$(curl --silent --show-error --fail-with-body \
            --connect-timeout 5 --max-time 20 \
            -F "chat_id=$chat_id" \
            -F 'title=DeadZone Sound Test' \
            -F 'performer=DeadZone System' \
            -F 'caption=🔊 DeadZone Sound Test' \
            -F 'audio=@/tmp/deadzone-sound-test.mp3;type=audio/mpeg' \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendAudio")"
          python3 - "$response" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if data.get('ok') is not True:
              raise SystemExit(data.get('description') or 'Telegram rejected sound')
          print('DeadZone Telegram sound smoke sent successfully')
          PY

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name deadzone-bot
          git config user.email deadzone-bot@users.noreply.github.com
          git rm -f .github/workflows/_sound_smoke_now.yml
          git commit -m 'test: remove temporary Telegram sound smoke'
          git push origin HEAD:main
