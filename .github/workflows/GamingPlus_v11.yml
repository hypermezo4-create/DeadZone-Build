name: "GamingPlus"

run-name: "DeadZone GamingPlus  ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Bot request ID"
        required: true
        type: string
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/DeadZone_SingleROM_v11.yml
    with:
      request_id: ${{ inputs.request_id }}
      project: gamingplus
      edition: GamingPlus
      request_code: GP
      engine_repository: hypermezo4-create/DeadZone_GamingPlus
      upload_slug: gamingplus
    secrets: inherit
