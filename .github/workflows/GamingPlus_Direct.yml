name: "🎮 DeadZone GamingPlus — Direct Build"

run-name: "DeadZone GamingPlus Direct • ${{ github.actor }} • #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      rom_link:
        description: "Direct HTTPS ROM link"
        required: true
        type: string
      builder_label:
        description: "Optional builder display label"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deadzone-gamingplus-direct
  cancel-in-progress: false

jobs:
  build:
    name: "🎮 Build DeadZone GamingPlus"
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REQUEST_ID: "DZ-GP-DIRECT-${{ github.run_id }}"
      BUILDER_NAME: ${{ inputs.builder_label || github.actor }}
      BUILDER_ID: ""
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID || secrets.TELEGRAM_CHANNEL_ID }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
      RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}

    steps:
      - name: Validate direct request
        shell: bash
        env:
          ROM_LINK: ${{ inputs.rom_link }}
          GAMINGPLUS_ENGINE_REPOSITORY: ${{ secrets.GAMINGPLUS_ENGINE_REPOSITORY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ "$ROM_LINK" == https://* ]] || { echo "ROM link must use HTTPS" >&2; exit 1; }
          [[ -n "$GAMINGPLUS_ENGINE_REPOSITORY" ]] || { echo "Missing GAMINGPLUS_ENGINE_REPOSITORY" >&2; exit 1; }
          [[ -n "$PRIVATE_REPO_TOKEN" ]] || { echo "Missing private repository token" >&2; exit 1; }
          for key in RCLONE_CONFIG_BASE64 RCLONE_REMOTE_NAME RCLONE_UPLOAD_DIR; do
            [[ -n "${!key:-}" ]] || { echo "Missing $key" >&2; exit 1; }
          done
          echo "::add-mask::$ROM_LINK"
          printf '%s' "$ROM_LINK" | base64 -w0 > "$RUNNER_TEMP/deadzone-gamingplus-rom.b64"

      - name: Prepare build workspace
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 768
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Gate available disk
        shell: bash
        run: |
          set -Eeuo pipefail
          available="$(df -Pk / | awk 'NR == 2 {print $4 * 1024}')"
          (( available >= 25 * 1024 * 1024 * 1024 )) || { echo "At least 25 GiB free is required" >&2; exit 1; }

      - name: Load DeadZone GamingPlus engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.GAMINGPLUS_ENGINE_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: toolbuild
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Set up OpenJDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare GamingPlus tools
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install requests
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          bash setup.sh 2>&1 | tee -a build_action.log
          python3 -m py_compile notify.py

      - name: Live — initialize GamingPlus
        working-directory: toolbuild
        continue-on-error: true
        shell: bash
        run: |
          rom="$(base64 --decode "$RUNNER_TEMP/deadzone-gamingplus-rom.b64")"
          env -u GITHUB_REPOSITORY -u GITHUB_RUN_ID -u GITHUB_RUN_NUMBER -u GITHUB_RUN_ATTEMPT -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_WORKFLOW -u GITHUB_JOB -u RUNNER_NAME \
            python3 notify.py start "" "$rom" gamingplus "$BUILDER_NAME" "$BUILDER_ID"

      - name: Live — process GamingPlus ROM
        working-directory: toolbuild
        continue-on-error: true
        shell: bash
        run: |
          rom="$(base64 --decode "$RUNNER_TEMP/deadzone-gamingplus-rom.b64")"
          env -u GITHUB_REPOSITORY -u GITHUB_RUN_ID -u GITHUB_RUN_NUMBER -u GITHUB_RUN_ATTEMPT -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_WORKFLOW -u GITHUB_JOB -u RUNNER_NAME \
            python3 notify.py download "" "$rom" gamingplus "$BUILDER_NAME" "$BUILDER_ID"

      - name: Build GamingPlus
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          rom="$(base64 --decode "$RUNNER_TEMP/deadzone-gamingplus-rom.b64")"
          bash build.sh "$rom" "DeadZone System" xst "$BUILDER_NAME" "$BUILDER_ID" 2>&1 | tee -a build_action.log

      - name: Live — package GamingPlus
        working-directory: toolbuild
        continue-on-error: true
        shell: bash
        run: |
          rom="$(base64 --decode "$RUNNER_TEMP/deadzone-gamingplus-rom.b64")"
          env -u GITHUB_REPOSITORY -u GITHUB_RUN_ID -u GITHUB_RUN_NUMBER -u GITHUB_RUN_ATTEMPT -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_WORKFLOW -u GITHUB_JOB -u RUNNER_NAME \
            python3 notify.py pack "" "$rom" gamingplus "$BUILDER_NAME" "$BUILDER_ID"

      - name: Pack GamingPlus
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          bash packROM.sh 2>&1 | tee -a build_action.log
          [[ -s build/baserom/images/super.img ]] || { echo "super.img is missing after packaging" >&2; exit 1; }

      - name: Live — deliver GamingPlus
        working-directory: toolbuild
        continue-on-error: true
        shell: bash
        run: |
          rom="$(base64 --decode "$RUNNER_TEMP/deadzone-gamingplus-rom.b64")"
          env -u GITHUB_REPOSITORY -u GITHUB_RUN_ID -u GITHUB_RUN_NUMBER -u GITHUB_RUN_ATTEMPT -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_WORKFLOW -u GITHUB_JOB -u RUNNER_NAME \
            python3 notify.py upload "" "$rom" gamingplus "$BUILDER_NAME" "$BUILDER_ID"

      - name: Upload GamingPlus
        working-directory: toolbuild
        shell: bash
        run: |
          set -Eeuo pipefail
          safe_builder="$(printf '%s' "$BUILDER_NAME" | tr -cs 'A-Za-z0-9._-' '_' | cut -c1-48)"
          base_dir="${RCLONE_UPLOAD_DIR%/}"
          export RCLONE_UPLOAD_DIR="${base_dir}/gamingplus/direct/${safe_builder}/${GITHUB_RUN_ID}"
          bash uploadROM.sh setup 2>&1 | tee -a build_action.log
          bash uploadROM.sh 2>&1 | tee -a build_action.log

      - name: Live — GamingPlus complete
        if: success()
        working-directory: toolbuild
        continue-on-error: true
        shell: bash
        run: |
          result="$(cat bin/ddevice/drive_link.txt 2>/dev/null || true)"
          env -u GITHUB_REPOSITORY -u GITHUB_RUN_ID -u GITHUB_RUN_NUMBER -u GITHUB_RUN_ATTEMPT -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_WORKFLOW -u GITHUB_JOB -u RUNNER_NAME \
            python3 notify.py success "" "$result" gamingplus "$BUILDER_NAME" "$BUILDER_ID"

      - name: Live — GamingPlus failed
        if: failure()
        working-directory: toolbuild
        continue-on-error: true
        env:
          NOTIFY_ERROR_LOG: build_action.log
          NOTIFY_ERROR_REASON: "DeadZone System stopped this build safely. Detailed diagnostics remain private."
        shell: bash
        run: |
          rom="$(base64 --decode "$RUNNER_TEMP/deadzone-gamingplus-rom.b64" 2>/dev/null || true)"
          env -u GITHUB_REPOSITORY -u GITHUB_RUN_ID -u GITHUB_RUN_NUMBER -u GITHUB_RUN_ATTEMPT -u GITHUB_SHA -u GITHUB_REF -u GITHUB_REF_NAME -u GITHUB_WORKFLOW -u GITHUB_JOB -u RUNNER_NAME \
            python3 notify.py fail "" "$rom" gamingplus "$BUILDER_NAME" "$BUILDER_ID"

      - name: Upload private diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gamingplus-direct-diagnostics-${{ github.run_id }}
          path: toolbuild/build_action.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/deadzone-gamingplus-rom.b64" toolbuild/rclone.conf
