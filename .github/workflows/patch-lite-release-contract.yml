name: Patch Lite release contract

on:
  push:
    paths:
      - .github/workflows/patch-lite-release-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Replace Lite result contract block
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/MEZO_Lite.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '      - name: Create result contract\n'
          end_marker = '      - name: Live — Lite verified\n'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Lite result-contract block markers not found')

          replacement = '''      - name: Create result contract
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/create_release_result.py" \\
            --engine "$PWD" \\
            --output "$GITHUB_WORKSPACE/deadzone-result.json" \\
            --request-id "$REQUEST_ID" \\
            --project lite

'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "DeadZone Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/MEZO_Lite.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish Lite release contract v1.1"
          git push origin HEAD:main
