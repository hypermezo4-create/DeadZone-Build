name: DeadZone Workflow Contract CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout workflows
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |f| YAML.load_file(f); puts "OK #{f}" }'

      - name: Compile telemetry sender
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/send_telemetry.py
          bash -n scripts/emit_stage.sh

      - name: Enforce request-ID-only Control Bot workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          workflows=(
            .github/workflows/MEZO_Lite.yml
            .github/workflows/frameworkpatcher.yml
            .github/workflows/gamingplus.yml
          )
          for workflow in "${workflows[@]}"; do
            test -s "$workflow"
            head -n 45 "$workflow" | grep -q 'request_id:'
            if head -n 45 "$workflow" | grep -Eq 'builder_name:|builder_id:|rom_link:|input_url:|framework_url:|services_url:|telegram_user_id:'; then
              echo "Sensitive Control Bot workflow input found in $workflow" >&2
              exit 1
            fi
            grep -q '^run-name:.*inputs.request_id' "$workflow"
          done

      - name: Verify direct GitHub build entry points
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .github/workflows/Lite_Test.yml
          test -s .github/workflows/GamingPlus_Direct.yml
          test -s .github/workflows/FrameworkPatcher_Direct.yml
          grep -q 'rom_link:' .github/workflows/Lite_Test.yml
          grep -q 'rom_link:' .github/workflows/GamingPlus_Direct.yml
          grep -q 'android_version:' .github/workflows/FrameworkPatcher_Direct.yml
          grep -q 'framework_url:' .github/workflows/FrameworkPatcher_Direct.yml
          grep -q 'LITE_ENGINE_REPOSITORY' .github/workflows/Lite_Test.yml
          grep -q 'GAMINGPLUS_ENGINE_REPOSITORY' .github/workflows/GamingPlus_Direct.yml
          grep -q 'FRAMEWORK_ENGINE_REPOSITORY' .github/workflows/FrameworkPatcher_Direct.yml
          for workflow in Lite_Test.yml GamingPlus_Direct.yml FrameworkPatcher_Direct.yml; do
            grep -q 'TELEGRAM_RELEASE_GROUP_ID' ".github/workflows/$workflow"
          done

      - name: Reject hardcoded private repository names
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -REn 'hypermezo4-create/(DeadZone_Lite|FrameworkPatcher-DeadZone|GamingPlus-DeadZone|FrameworkPatcherModule)' .github/workflows; then
            echo 'A private repository name is hardcoded in the public launcher.' >&2
            exit 1
          fi

      - name: Verify canonical workflows use V3 private contract resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          production='deadzone-mezo-v3-20260726.fly.dev'
          for workflow in MEZO_Lite.yml frameworkpatcher.yml gamingplus.yml; do
            path=".github/workflows/$workflow"
            grep -q "$production/contract/resolve" "$path"
            grep -q "$production/telemetry" "$path"
            ! grep -q 'deadzonebot.fly.dev' "$path"
            grep -q 'BUILD_PROGRESS_SECRET' "$path"
            grep -q 'X-DeadZone-Signature' "$path"
            grep -q 'deadzone-result-${{ inputs.request_id }}' "$path"
          done

      - name: Keep member-facing labels provider-neutral
        shell: bash
        run: |
          set -Eeuo pipefail
          for workflow in Lite_Test.yml GamingPlus_Direct.yml FrameworkPatcher_Direct.yml; do
            grep -q 'DeadZone' ".github/workflows/$workflow"
            if grep -E 'name: .*GitHub|name: .*Fly|name: .*Runner' ".github/workflows/$workflow"; then
              echo "Provider-facing live step label found in $workflow" >&2
              exit 1
            fi
          done

      - name: Publish launcher contract verification status
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=deadzone/build-contract \
            -f description='DeadZone launcher contract validation passed' \
            >/dev/null

      - name: Publish launcher contract failure status
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=deadzone/build-contract \
            -f description='DeadZone launcher contract validation failed' \
            >/dev/null || true
