name: Temporary real sound smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/_tmp_real_sound_test.yml

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - name: Send amplified T-main sound
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MEZO_PRIVATE_CHAT_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/sound.b64 <<'B64'

B64
          base64 -d /tmp/sound.b64 > /tmp/source.mp3
          ffmpeg -hide_banner -loglevel error -y -i /tmp/source.mp3 -af 'volume=8dB' -c:a libmp3lame -b:a 128k /tmp/deadzone-test.mp3
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/deadzone-test.mp3
          response="$(curl --silent --show-error --fail-with-body \
            -F "chat_id=${MEZO_PRIVATE_CHAT_ID}" \
            -F "audio=@/tmp/deadzone-test.mp3;type=audio/mpeg" \
            -F "title=DeadZone REAL SOUND TEST" \
            -F "performer=T-main Vibe" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendAudio")"
          python3 - "$response" <<'PY'
import json, sys
obj = json.loads(sys.argv[1])
if obj.get('ok') is not True:
    raise SystemExit(obj.get('description') or 'Telegram rejected sound')
print('REAL_SOUND_SENT_OK')
PY
          rm -f .github/workflows/_tmp_real_sound_test.yml
          git config user.name deadzone-bot
          git config user.email deadzone-bot@users.noreply.github.com
          git add .github/workflows/_tmp_real_sound_test.yml
          git commit -m 'test: remove real sound smoke after confirmed delivery'
          git push origin HEAD:main
