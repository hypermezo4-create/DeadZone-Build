name: "Lite Test"

run-name: "Lite Test  ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Existing DeadZone Lite request ID"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canonical-lite:
    uses: ./.github/workflows/MEZO_Lite.yml
    with:
      request_id: ${{ inputs.request_id }}
    secrets: inherit
