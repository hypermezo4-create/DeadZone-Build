# one-shot sync trigger
name: Copy OS3 apps once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/copy-os3-apps-once.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate private repository token
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "${PRIVATE_TOKEN:-}" ]] || { echo "Missing PRIVATE_REPO_TOKEN/GH_TOKEN" >&2; exit 1; }

      - name: Checkout GamingPlus source
        uses: actions/checkout@v4
        with:
          repository: hypermezo4-create/GamingPlus-DeadZone
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: source
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Checkout DeadZone Lite target
        uses: actions/checkout@v4
        with:
          repository: hypermezo4-create/DeadZone_Lite
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: main
          path: target
          fetch-depth: 0
          lfs: true
          persist-credentials: true

      - name: Copy OS3 APKs preserving paths
        shell: bash
        run: |
          set -Eeuo pipefail
          source_root="$GITHUB_WORKSPACE/source/bin/modfile/OS3"
          target_root="$GITHUB_WORKSPACE/target/bin/mods/OS3"
          [[ -d "$source_root" ]] || { echo "Source OS3 directory is missing" >&2; exit 1; }
          mkdir -p "$target_root"

          count=0
          while IFS= read -r -d '' apk; do
            rel="${apk#"$source_root"/}"
            install -D -m 0644 "$apk" "$target_root/$rel"
            count=$((count + 1))
          done < <(find "$source_root" -type f -name '*.apk' -print0)

          (( count > 0 )) || { echo "No OS3 APK files found" >&2; exit 1; }
          echo "Copied $count OS3 APK files"

      - name: Commit synced apps to DeadZone Lite
        working-directory: target
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/mods/OS3
          if git diff --cached --quiet; then
            echo "DeadZone Lite already has the same OS3 APK files"
            exit 0
          fi
          git commit -m "mods: sync OS3 apps from GamingPlus"
          git push origin HEAD:main
