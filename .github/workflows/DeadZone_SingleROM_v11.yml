name: "DeadZone Single ROM v1.1"

on:
  workflow_call:
    inputs:
      request_id:
        required: true
        type: string
      project:
        required: true
        type: string
      edition:
        required: true
        type: string
      request_code:
        required: true
        type: string
      engine_repository:
        required: true
        type: string
      upload_slug:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REQUEST_ID: ${{ inputs.request_id }}
      DEADZONE_PROJECT: ${{ inputs.project }}
      EDITION_NAME: ${{ inputs.edition }}
      REQUEST_CODE: ${{ inputs.request_code }}
      ENGINE_REPOSITORY: ${{ inputs.engine_repository }}
      UPLOAD_SLUG: ${{ inputs.upload_slug }}
      CONTROL_BOT_CONTRACT_URL: https://deadzone-mezo-v3-20260726.fly.dev/contract/resolve
      CONTROL_BOT_TELEMETRY_URL: https://deadzone-mezo-v3-20260726.fly.dev/telemetry
      BUILD_PROGRESS_SECRET: ${{ secrets.BUILD_PROGRESS_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      MEZO_PRIVATE_CHAT_ID: ${{ secrets.MEZO_PRIVATE_CHAT_ID }}
      TELEGRAM_RELEASE_GROUP_ID: ${{ secrets.TELEGRAM_RELEASE_GROUP_ID }}
      MEZO_CONTACT_LINK: ${{ secrets.MEZO_CONTACT_LINK }}
      UPDATES_GROUP_LINK: ${{ secrets.UPDATES_GROUP_LINK }}
      SCREENSHOTS_GROUP_LINK: ${{ secrets.SCREENSHOTS_GROUP_LINK }}
      CHAT_GROUP_LINK: ${{ secrets.CHAT_GROUP_LINK }}
      CHANGELOG_LINK: ${{ secrets.CHANGELOG_LINK }}
      SCREENSHOTS_POST_LINK: ${{ secrets.SCREENSHOTS_POST_LINK }}
      RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
      RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
      RCLONE_UPLOAD_DIR: ${{ secrets.RCLONE_UPLOAD_DIR }}
      RCLONE_PUBLIC_LINK_BASE: ${{ secrets.RCLONE_PUBLIC_LINK_BASE }}

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794
        with:
          swap-size-mb: 1024
          root-reserve-mb: 512
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: Checkout launcher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate request ID
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="^DZ-${REQUEST_CODE}-[0-9]{8}-[0-9]{4}$"
          [[ "$REQUEST_ID" =~ $expected ]] || {
            echo "Invalid ${EDITION_NAME} request ID" >&2
            exit 1
          }
          echo "BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Live — prepare edition
        continue-on-error: true
        run: bash scripts/emit_stage.sh preparing in_progress 0 "Preparing DeadZone ${EDITION_NAME}." || true

      - name: Resolve private request contract
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${BUILD_PROGRESS_SECRET:-}" ]] || { echo "Missing BUILD_PROGRESS_SECRET" >&2; exit 1; }
          python3 - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone

          secret = os.environ["BUILD_PROGRESS_SECRET"]
          request_id = os.environ["REQUEST_ID"]
          project = os.environ["DEADZONE_PROJECT"]
          edition = os.environ["EDITION_NAME"]
          payload = {
              "schema_version": "1.0",
              "request_id": request_id,
              "project": project,
              "timestamp": datetime.now(timezone.utc).isoformat(),
          }
          body = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          signature = hmac.new(secret.encode(), body, hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              os.environ["CONTROL_BOT_CONTRACT_URL"],
              data=body,
              method="POST",
              headers={"Content-Type": "application/json", "X-DeadZone-Signature": signature},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              response_body = response.read()
              response_signature = response.headers.get("X-DeadZone-Signature", "")
          expected = hmac.new(secret.encode(), response_body, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, response_signature):
              raise SystemExit("Invalid control response signature")

          contract = json.loads(response_body)
          if contract.get("request_id") != request_id or contract.get("project") != project:
              raise SystemExit("Private contract mismatch")

          source_url = str((contract.get("source") or {}).get("url") or "")
          builder = contract.get("builder") or {}
          live = contract.get("live_message") or {}
          builder_id = int(builder.get("telegram_user_id") or 0)
          builder_slug = str(builder.get("slug") or "")
          builder_name = str(builder.get("display_name") or builder.get("username") or builder_slug or "DeadZone Builder")
          language = "ar" if str(contract.get("language") or "").lower() == "ar" else "en"
          status_chat_id = int(live.get("chat_id") or 0)
          status_message_id = int(live.get("message_id") or 0)

          if not source_url.startswith("https://"):
              raise SystemExit(f"{edition} source URL is missing or invalid")
          if builder_id <= 0 or not re.fullmatch(r"[a-z0-9_.-]{1,48}", builder_slug):
              raise SystemExit("Builder identity is invalid")
          if status_chat_id == 0 or status_message_id <= 0:
              raise SystemExit(f"{edition} live-message contract is missing")

          print(f"::add-mask::{source_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write("ROM_URL_B64=" + base64.b64encode(source_url.encode()).decode() + "\n")
              out.write(f"BUILDER_ID={builder_id}\n")
              out.write(f"BUILDER_SLUG={builder_slug}\n")
              out.write("BUILDER_NAME_B64=" + base64.b64encode(builder_name.encode()).decode() + "\n")
              out.write(f"DEADZONE_LANGUAGE={language}\n")
              out.write(f"TELEGRAM_MSG_CHAT_ID={status_chat_id}\n")
              out.write(f"TELEGRAM_MSG_ID={status_message_id}\n")
              out.write("REQUEST_SOURCE=telegram\n")
              out.write("DEADZONE_CONTROLLED_BUILD=1\n")
          PY

      - name: Validate private build configuration
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$PRIVATE_REPO_TOKEN" ]] || { echo "Missing private repository token" >&2; exit 1; }
          for key in RCLONE_CONFIG_BASE64 RCLONE_REMOTE_NAME RCLONE_UPLOAD_DIR; do
            [[ -n "${!key:-}" ]] || { echo "Missing $key" >&2; exit 1; }
          done

      - name: Live — load edition engine
        continue-on-error: true
        run: bash scripts/emit_stage.sh loading_engine in_progress 1 "Loading DeadZone ${EDITION_NAME}." || true

      - name: Load private edition engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.engine_repository }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: engine
          ref: main
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Live — prepare edition tools
        continue-on-error: true
        run: bash scripts/emit_stage.sh installing_tools in_progress 2 "Preparing ${EDITION_NAME} tools." || true

      - name: Prepare build environment
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo timedatectl set-timezone Africa/Cairo
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            software-properties-common ca-certificates curl gnupg file git aria2 jq sshpass ffmpeg \
            python-is-python3 wget python3 python3-pip lz4 xz-utils brotli device-tree-compiler \
            zlib1g-dev gcc g++ libc6 libstdc++6 dialog libgtk-3-dev busybox zip unzip p7zip-full \
            zstd bc android-sdk-libsparse-utils golang-go rclone
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends erofs-utils xmlstarlet zipalign aapt || true
          sudo env GOBIN=/usr/local/bin go install github.com/ssut/payload-dumper-go/cmd/payload-dumper-go@latest || true
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user ConfigObj requests telebot setuptools gdown zstandard
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          find . -type f -name '*.sh' -exec chmod +x {} +
          chmod +x build.sh packROM.sh uploadROM.sh
          chmod +x bin/Linux/x86_64/* 2>/dev/null || true
          chmod +x bin/tool/Linux/x86_64/* 2>/dev/null || true
          bash -n build.sh
          bash -n packROM.sh
          bash -n uploadROM.sh

      - name: Build, pack and upload edition
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          rom="$(printf '%s' "$ROM_URL_B64" | base64 --decode)"
          export BUILDER_NAME="$(printf '%s' "$BUILDER_NAME_B64" | base64 --decode)"
          export INPUT_URL="$rom"

          bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh" building in_progress 3 "Building DeadZone ${EDITION_NAME}." || true
          sudo -E env \
            "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "INPUT_URL=$INPUT_URL" "BUILDER_NAME=$BUILDER_NAME" "BUILDER_ID=$BUILDER_ID" \
            "BUILDER_SLUG=$BUILDER_SLUG" "DEADZONE_LANGUAGE=$DEADZONE_LANGUAGE" \
            "DEADZONE_CONTROLLED_BUILD=1" "TELEGRAM_MSG_CHAT_ID=$TELEGRAM_MSG_CHAT_ID" \
            "TELEGRAM_MSG_ID=$TELEGRAM_MSG_ID" \
            bash build.sh "$rom" 2>&1 | tee build_action.log

          bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh" packaging in_progress 4 "Packaging DeadZone ${EDITION_NAME}." || true
          sudo -E env \
            "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            bash packROM.sh 2>&1 | tee pack_action.log
          [[ -s build/baserom/images/super.img ]] || { echo "super.img is missing after packaging" >&2; exit 1; }

          bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh" preparing_upload in_progress 5 "Preparing ${EDITION_NAME} delivery." || true
          sudo -E env \
            "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "RCLONE_CONFIG_BASE64=$RCLONE_CONFIG_BASE64" \
            bash uploadROM.sh setup 2>&1 | tee setup_upload_action.log

          codename="$(cat bin/runtime/info/device_f.txt 2>/dev/null || cat bin/runtime/info/device_code.txt)"
          codename_slug="$(printf '%s' "$codename" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9._-')"
          [[ -n "$codename_slug" ]] || { echo "Invalid resolved codename" >&2; exit 1; }
          base_dir="${RCLONE_UPLOAD_DIR%/}"
          export EDITION_UPLOAD_DIR="${base_dir}/${UPLOAD_SLUG}/${codename_slug}"

          bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh" uploading in_progress 6 "Uploading DeadZone ${EDITION_NAME}." || true
          sudo -E env \
            "PATH=$PATH" "HOME=$HOME" "GITHUB_ENV=$GITHUB_ENV" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            "RCLONE_CONFIG_BASE64=$RCLONE_CONFIG_BASE64" "RCLONE_REMOTE_NAME=$RCLONE_REMOTE_NAME" \
            "RCLONE_UPLOAD_DIR=$EDITION_UPLOAD_DIR" "RCLONE_PUBLIC_LINK_BASE=${RCLONE_PUBLIC_LINK_BASE:-}" \
            "DEADZONE_CONTROLLED_BUILD=0" \
            bash uploadROM.sh 2>&1 | tee upload_action.log

          bash "$GITHUB_WORKSPACE/scripts/emit_stage.sh" finalizing in_progress 7 "Final verification for DeadZone ${EDITION_NAME}." || true

      - name: Create release result contract v1.1
        working-directory: engine
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          info = Path("bin/runtime/info")

          def first(names):
              for name in names:
                  path = info / name
                  if path.is_file():
                      value = path.read_text(encoding="utf-8", errors="replace").strip()
                      if value:
                          return value
              return ""

          project = os.environ["DEADZONE_PROJECT"]
          edition = os.environ["EDITION_NAME"]
          request_id = os.environ["REQUEST_ID"]
          file_name = first(["output_zip.txt", "output_file.txt"])
          output_path = first(["output_path.txt"])
          artifact = Path(output_path) if output_path else Path("out") / file_name
          link = first(["drive_link.txt", "upload_link.txt"])
          codename = first(["device_f.txt", "device_code.txt"]).lower()
          rom_version = first(["base_rom_code.txt", "rom_version.txt"])
          android_version = first(["androidver.txt", "android_version.txt"])
          region_raw = first(["region.txt", "device_type.txt"])
          version_raw = Path("Version").read_text(encoding="utf-8").strip()

          if not artifact.is_file() or artifact.stat().st_size <= 0:
              raise SystemExit(f"{edition} output archive is missing")
          if artifact.name != file_name:
              raise SystemExit(f"{edition} output metadata does not match the archive")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,190}\.zip", file_name):
              raise SystemExit(f"{edition} output filename is invalid")

          parsed = urlsplit(link)
          host = (parsed.hostname or "").lower().rstrip(".")
          if parsed.scheme != "https" or host not in {"drive.google.com", "docs.google.com"} or not parsed.path or parsed.path == "/":
              raise SystemExit(f"{edition} Drive link is invalid")

          if not re.fullmatch(r"[a-z0-9][a-z0-9._-]{0,39}", codename):
              raise SystemExit(f"{edition} codename is invalid")
          if not rom_version or not android_version or not region_raw or not version_raw:
              raise SystemExit(f"{edition} release metadata is incomplete")

          try:
              with zipfile.ZipFile(artifact) as archive:
                  bad_member = archive.testzip()
          except (OSError, zipfile.BadZipFile) as exc:
              raise SystemExit(f"{edition} archive integrity verification failed") from exc
          if bad_member is not None:
              raise SystemExit(f"{edition} archive contains a corrupt member: {bad_member}")

          region_map = {
              "china": "ChinaStable",
              "global": "GlobalStable",
              "eeaglobal": "EEAStable",
              "europe": "EEAStable",
              "inglobal": "IndiaStable",
              "idglobal": "IndonesiaStable",
              "ruglobal": "RussiaStable",
              "twglobal": "TaiwanStable",
              "trglobal": "TurkeyStable",
              "jpglobal": "JapanStable",
          }
          region = region_map.get(region_raw.lower(), region_raw)
          edition_version = version_raw if version_raw[:1] in {"V", "v"} else f"V{version_raw}"
          edition_version = "V" + edition_version[1:] if edition_version.startswith("v") else edition_version

          result = {
              "schema_version": "1.1",
              "request_id": request_id,
              "project": project,
              "edition": edition,
              "edition_version": edition_version,
              "codename": codename,
              "status": "success",
              "provider": "google_drive",
              "url": link,
              "file_name": file_name,
              "size": artifact.stat().st_size,
              "rom_version": rom_version,
              "android_version": android_version,
              "region": region,
              "integrity_verified": True,
              "completed_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("../deadzone-result.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Expose release contract v1.1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-result-${{ inputs.request_id }}
          path: deadzone-result.json
          if-no-files-found: error
          retention-days: 1

      - name: Live — edition verified
        if: success()
        continue-on-error: true
        run: bash scripts/emit_stage.sh finalizing success 8 "DeadZone ${EDITION_NAME} completed." || true

      - name: Live — edition failed
        if: failure()
        continue-on-error: true
        run: bash scripts/emit_stage.sh "${DZ_CURRENT_STAGE_KEY:-preparing}" failed "${DZ_COMPLETED_STAGES:-0}" "DeadZone ${EDITION_NAME} stopped safely." || true

      - name: Upload private diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deadzone-${{ inputs.project }}-diagnostics-${{ inputs.request_id }}
          path: |
            engine/build_action.log
            engine/pack_action.log
            engine/setup_upload_action.log
            engine/upload_action.log
            engine/bin/runtime/logs/
            engine/bin/runtime/reports/
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary credentials
        if: always()
        shell: bash
        run: rm -f -- engine/rclone.conf engine/bin/runtime/config/rclone.conf
